<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>WhatNext Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#3B82F6',
                            50: '#EFF6FF', 100: '#DBEAFE', 200: '#BFDBFE', 300: '#93C5FD',
                            400: '#60A5FA', 500: '#3B82F6', 600: '#2563EB', 700: '#1D4ED8',
                            800: '#1E40AF', 900: '#1E3A8A',
                        },
                        accent: {
                            DEFAULT: '#EC4899',
                            50: '#FDF2F8', 100: '#FCE7F3', 200: '#FBCFE8', 300: '#F9A8D4',
                            400: '#F472B6', 500: '#EC4899', 600: '#DB2777', 700: '#BE185D',
                            800: '#9D174D', 900: '#831843',
                        },
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="companion.css">
</head>
<body class="bg-gray-900 text-gray-100 font-mono min-h-screen flex flex-col">
    <!-- ====== Join Form ====== -->
    <div id="join-screen" class="flex-1 flex items-center justify-center px-6">
        <div class="w-full max-w-sm text-center space-y-6">
            <h1 class="text-2xl font-bold text-primary-400">WhatNext</h1>
            <p class="text-gray-400 text-sm">Join the listening session</p>
            <form id="join-form" class="space-y-4">
                <input
                    id="display-name-input"
                    type="text"
                    placeholder="Your name"
                    maxlength="30"
                    required
                    autocomplete="off"
                    class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-gray-100
                           placeholder-gray-500 focus:outline-none focus:border-primary-500 focus:ring-1
                           focus:ring-primary-500 text-center text-lg"
                >
                <!-- Hidden when the PIN arrives in the link (QR scan stays one step) -->
                <input
                    id="join-pin-input"
                    type="text"
                    placeholder="PIN"
                    maxlength="4"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-gray-100
                           placeholder-gray-500 focus:outline-none focus:border-primary-500 focus:ring-1
                           focus:ring-primary-500 text-center text-lg uppercase tracking-[0.4em]"
                >
                <button
                    id="join-submit"
                    type="submit"
                    class="w-full py-3 bg-primary-600 hover:bg-primary-500 active:bg-primary-700
                           rounded-lg font-semibold text-white transition-colors min-h-[44px]
                           disabled:opacity-50"
                >
                    Join Session
                </button>
                <p id="join-error" class="text-sm text-red-400 hidden"></p>
            </form>
        </div>
    </div>

    <!-- ====== Session View (hidden until join) ====== -->
    <div id="session-screen" class="flex-1 flex flex-col hidden">
        <!-- Header -->
        <header class="flex items-center justify-between px-4 py-3 bg-gray-800/80 backdrop-blur-sm border-b border-gray-700/50 safe-top">
            <div class="flex items-center gap-2">
                <span class="text-primary-400 font-bold text-sm">WN</span>
                <span id="session-name" class="text-sm text-gray-300 truncate max-w-[200px]">Session</span>
            </div>
            <div class="flex items-center gap-2">
                <span id="client-count" class="text-xs text-gray-500"></span>
                <span id="connection-dot" class="connection-dot connection-dot--disconnected"></span>
            </div>
        </header>

        <!-- Now Playing (hero) -->
        <section id="now-playing" class="px-4 pt-4 pb-2">
            <div class="flex items-center gap-4">
                <div class="w-20 h-20 rounded-lg bg-gray-800 overflow-hidden flex-shrink-0 shadow-lg">
                    <img id="album-art" src="" alt="" class="w-full h-full object-cover hidden">
                    <div id="album-art-placeholder" class="w-full h-full flex items-center justify-center text-gray-600">
                        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    </div>
                </div>
                <div class="flex-1 min-w-0">
                    <p id="track-title" class="font-semibold text-gray-100 truncate">No track playing</p>
                    <p id="track-artists" class="text-sm text-gray-400 truncate"></p>
                    <div class="mt-2">
                        <div class="w-full h-1 bg-gray-700 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-primary-500 rounded-full transition-none" style="width: 0%"></div>
                        </div>
                        <div class="flex justify-between mt-1">
                            <span id="progress-time" class="text-[10px] text-gray-500">0:00</span>
                            <span id="duration-time" class="text-[10px] text-gray-500">0:00</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Reactions + Time Request -->
        <section class="px-4 py-2 flex items-center gap-2">
            <div id="reactions-bar" class="flex gap-1 flex-1">
                <button class="reaction-btn" data-emoji="&#x1F525;">&#x1F525;</button>
                <button class="reaction-btn" data-emoji="&#x2764;&#xFE0F;">&#x2764;&#xFE0F;</button>
                <button class="reaction-btn" data-emoji="&#x1F44F;">&#x1F44F;</button>
                <button class="reaction-btn" data-emoji="&#x1F62E;">&#x1F62E;</button>
                <button class="reaction-btn" data-emoji="&#x1F480;">&#x1F480;</button>
                <button class="reaction-btn" data-emoji="&#x1F3B5;">&#x1F3B5;</button>
            </div>
            <button
                id="time-request-btn"
                class="px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-xs text-gray-300
                       hover:border-accent-500 hover:text-accent-400 active:bg-gray-700 transition-colors
                       min-h-[44px] whitespace-nowrap disabled:opacity-40 disabled:cursor-not-allowed"
            >
                More Time
            </button>
        </section>

        <!-- Floating reactions container -->
        <div id="reaction-container" class="fixed inset-0 pointer-events-none z-50"></div>

        <!-- Queue -->
        <section class="flex-1 overflow-y-auto px-4 pb-2">
            <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Queue</h2>
            <div id="track-list" class="space-y-1"></div>
            <div id="track-list-empty" class="text-center text-gray-600 text-sm py-8 hidden">
                No tracks in queue
            </div>
        </section>

        <!-- Participants -->
        <section class="px-4 py-3 bg-gray-800/50 border-t border-gray-700/50 safe-bottom">
            <div id="participant-list" class="flex items-center gap-2 overflow-x-auto"></div>
        </section>
    </div>

    <script src="companion.js"></script>
</body>
</html>
