name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [mvp, main]
  workflow_dispatch:

jobs:
  # Prettier lives in the root package, not in app/, because its scope spans
  # app/, relay/, service/, test-peer/, scripts/ and the top-level markdown.
  # That root install is this job's only dependency — the other jobs still
  # install in app/ and are unaffected by it.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: TypeCheck
        run: npm run typecheck
        working-directory: app

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Lint
        run: npm run lint
        working-directory: app

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      # Vitest only. The suite also covers ../relay and ../service (see
      # app/vitest.config.ts `include`), which resolve their imports out of
      # app/node_modules. Playwright e2e is deliberately absent: it needs a
      # built app and a display.
      - name: Test
        run: npm test
        working-directory: app
